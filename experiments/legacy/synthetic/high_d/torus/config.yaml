data:
  D: 256
  d: [2, 4, 8]
  hidden_mult: 4
  n: [50, 100, 200, 500, 1000, 2000, 5000, 10000]
  geometry_seed: 0

model:
  hidden_dim: 256
  depth: 3
  activation: silu
  time_embed_dim: 64

flow_matching:
  pred_space: [x, eps, v]
  loss_space: [v]
  time_mu: -0.8
  time_sigma: 0.8
  denom_clip: 0.05
  t_clip: [0.001, 0.999]
  sampler: heun
  sample_steps: 100

training:
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 1.0e-4
  warmup_fraction: 0.05
  ema_decay: 0.9999
  lr: 3.0e-4
  batch_size: 512
  max_steps: 20000
  ckpt_interval_steps: 500

evaluation:
  f_mem_threshold: 0.5
  tau_mem_onset: 0.05
  seeds: [0, 1, 2]
  metric_space: euclidean
  n_gen_samples: 2000
  sample_steps: 100
  compute_lid: true
