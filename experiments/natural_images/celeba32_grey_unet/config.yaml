data:
  split: train
  resolution: 32
  n: [200, 500, 1000, 2000, 5000, 10000, 50000]
  holdout_size: 10000

model:
  in_channels: 1
  base_channels: 64
  channel_mults: [1, 2, 4, 4]
  attention_resolutions: [8]
  num_res_blocks: 2
  dropout: 0.0

flow_matching:
  pred_space: [x, eps, v]
  loss_space: [v]
  time_mu: -0.8
  time_sigma: 0.8
  denom_clip: 0.05
  t_clip: [0.001, 0.999]
  sampler: heun
  sample_steps: 100

training:
  optimizer: adamw
  betas: [0.9, 0.95]
  weight_decay: 1.0e-4
  warmup_fraction: 0.05
  ema_decay: 0.9999
  lr: 2.0e-4
  batch_size: 128
  max_epochs: 2000
  ckpt_interval_epochs: 50

evaluation:
  f_mem_threshold: 0.5
  tau_mem_onset: 0.05
  seeds: [0, 1, 2]
  metric_space: euclidean
  n_gen_samples: 10000
  compute_fid: true
